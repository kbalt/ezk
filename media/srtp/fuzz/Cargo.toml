[package]
name = "ezk-srtp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Its own workspace so the fuzz crate, which needs a nightly toolchain and sanitizer
# flags, stays out of the normal `cargo build --workspace`
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
srtp = { package = "ezk-srtp", path = "..", default-features = false }

[[bin]]
name = "unprotect_rtp"
path = "fuzz_targets/unprotect_rtp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unprotect_rtcp"
path = "fuzz_targets/unprotect_rtcp.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
